name: Docker

on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'docker/**', 'docker-compose.yml', 'src/**', 'build/slim-vendor.sh', 'composer.json', '.github/workflows/docker.yml']
    tags: ['v*']
  pull_request:
    paths: ['Dockerfile', 'docker/**', 'docker-compose.yml', 'build/slim-vendor.sh', 'composer.json', '.github/workflows/docker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Image bauen und testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image bauen (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/metapixel/metarechnung:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Größe
        run: docker image ls ghcr.io/metapixel/metarechnung:ci
      - name: Rauchtest (Compose mit MariaDB und Cron)
        run: docker/smoke-test.sh

  publish:
    name: Veröffentlichen (GHCR, amd64 + arm64)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag muss zur VERSION passen
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "Tag ${GITHUB_REF_NAME} passt nicht zu VERSION $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/metapixel/metarechnung
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
