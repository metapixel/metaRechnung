name: CI
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: '17 4 * * 1'   # wöchentlich: neue Sicherheitslücken in Abhängigkeiten erkennen

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, dom, xml, simplexml, pdo_mysql, zip
          tools: composer:v2
      - name: Syntax prüfen (alle PHP-Dateien)
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l | grep -v '^No syntax errors' || true
          ! find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l 2>&1 | grep -q 'Parse error'
      - name: composer validate
        run: composer validate --no-check-lock
      - name: Abhängigkeiten installieren
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: Sicherheits-Audit der Abhängigkeiten
        run: composer audit --no-dev
      - name: Keine Inline-Skripte / Event-Handler in Views (CSP)
        run: "! grep -rPn '<script(?![^>]*src=)|\\bon(click|submit|change|load)=' src/views || (echo 'Inline-Skripte verletzen die CSP'; exit 1)"

  semgrep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Semgrep (PHP-Regeln)
        run: |
          pip install semgrep
          semgrep scan --config p/php --config p/security-audit --error --exclude vendor --exclude tests .
