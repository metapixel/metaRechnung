# metaRechnung mit MariaDB und Cron-Container.
#   1. cp .env.example .env   und die Werte eintragen
#   2. docker compose up -d
#   3. Im Browser http://localhost:8080 öffnen (für Betrieb im Internet: Reverse-Proxy mit HTTPS davorsetzen)
services:
  app:
    image: ghcr.io/metapixel/metarechnung:${METARECHNUNG_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: metarechnung
      DB_USER: metarechnung
      DB_PASS: ${DB_PASS:?DB_PASS in .env setzen}
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy

  # Erzeugt fällige wiederkehrende Rechnungen (ersetzt den Cronjob)
  cron:
    image: ghcr.io/metapixel/metarechnung:${METARECHNUNG_TAG:-latest}
    restart: unless-stopped
    command: ["cron"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: metarechnung
      DB_USER: metarechnung
      DB_PASS: ${DB_PASS:?DB_PASS in .env setzen}
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: metarechnung
      MARIADB_USER: metarechnung
      MARIADB_PASSWORD: ${DB_PASS:?DB_PASS in .env setzen}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  app-data:
  db-data:
