# nginx für metaRechnung im Container (läuft ohne Root-Rechte auf Port 8080)
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types { application/manifest+json webmanifest; }
    charset utf-8;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/nginx-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    proxy_temp_path /tmp/nginx-proxy;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    client_max_body_size 32m;

    server {
        listen 8080 default_server;
        server_name _;
        root /app;
        index index.php;

        include /etc/nginx/security-headers.conf;

        if ($request_method ~ ^(TRACE|TRACK)$) { return 405; }

        # Nie von außen ausliefern: interne Ordner, Zugangsdaten, Versions-/Doku-Dateien, versteckte Dateien
        location ~ ^/(vendor|src|storage|docker|build|tests)(/|$) { return 404; }
        location ~ /\. { return 404; }
        location ~* ^/(config(\.tmp)?\.php|VERSION|composer\..*|Dockerfile.*)$ { return 404; }
        location ~* \.(md|sql|log|dist)$ { return 404; }

        location ~* \.(js|css|webmanifest)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # Nur die Einstiegsskripte der App werden ausgeführt
        location ~ ^/(index|status|cron|export)\.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 120s;
        }
        location ~ \.php$ { return 404; }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
